name: Update official prices
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      provider:
        description: '留空检查全部；单厂商使用 provider ID'
        type: string
        default: ''
      approve_change_ids:
        description: '已核对的 manual_review 变更 ID，逗号分隔；blocked 不可放行'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: pricing-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      review_count: ${{ steps.update.outputs.review_count }}
      failed_count: ${{ steps.update.outputs.failed_count }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Remember checked-out revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - name: Restore last check state from GitHub artifacts
        uses: actions/github-script@v7
        with:
          script: |
            await require('./scripts/github/restore-state.cjs')({github, context});
      - name: Extract optional prior state
        run: |
          if [ -f reports/prior-state.zip ]; then
            unzip -p reports/prior-state.zip verification.json > reports/previous-verification.json
          fi
      - name: Fetch, normalize, diff, gate, test and build
        id: update
        env:
          SELECTED_PROVIDER: ${{ inputs.provider }}
          APPROVED_CHANGES: ${{ inputs.approve_change_ids }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          args=(--apply --state=reports/previous-verification.json)
          if [ -n "$SELECTED_PROVIDER" ]; then args+=("--provider=$SELECTED_PROVIDER"); fi
          if [ -n "$APPROVED_CHANGES" ]; then args+=("--approve=$APPROVED_CHANGES"); fi
          npm run prices:update -- "${args[@]}"
      - name: Reject a stale checkout before deployment
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
      - name: Prepare a local data commit only for meaningful changes
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/catalog.json src/data/price-history.json src/data/verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(prices): publish validated official pricing changes'
      - name: Preserve validated candidate data for recovery
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pricing-candidate-data
          path: |
            src/data/catalog.json
            src/data/price-history.json
            src/data/verification.json
          retention-days: 90
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy the validated static build
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Publish data commit after successful Pages deployment
        if: steps.update.outputs.changed == 'true' && steps.deployment.outcome == 'success'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Save per-run freshness without timestamp-only commits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-run-state
          path: reports/verification.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Save price diff and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pricing-review
          path: |
            reports/review-report.json
            reports/review-pending.json
            reports/price-review.md
          if-no-files-found: ignore
          retention-days: 90
  review:
    needs: update
    if: always() && vars.ENABLE_PRICE_REVIEW_PRS == 'true' && needs.update.outputs.review_count != '' && needs.update.outputs.review_count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v4
        with:
          name: pricing-review
          path: reports
      - run: cp reports/review-pending.json data/review-report.json
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/pricing-review
          title: '核验官方价格异常与新模型'
          commit-message: 'chore(prices): update pending review evidence'
          body-path: reports/price-review.md
          add-paths: data/review-report.json
  attention:
    needs: [update, review]
    if: always() && ((needs.update.outputs.review_count != '' && needs.update.outputs.review_count != '0') || (needs.update.outputs.failed_count != '' && needs.update.outputs.failed_count != '0'))
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Flag manual attention without blocking healthy-provider deployment
        run: |
          echo '::error::部分厂商需要人工处理；已阻止异常价格，保留旧价。请查看 Workflow Summary、pricing-review artifact 和审核 PR。'
          exit 1
